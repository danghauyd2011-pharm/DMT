name: Build va Deploy Danh Muc Thuoc

on:
  push:
    branches: [main]
    paths:          # ← THÊM DÒNG NÀY
      - '**.xlsx'   # Chạy khi upload .xlsx
      - '**.xls'    # Chạy khi upload .xls
      - 'build.py'  # Chạy khi sửa build.py
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install pandas openpyxl

      - name: Build JSON from Excel
        run: python build.py

      - name: Commit docs/ back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet && echo "No changes to commit" || (git commit -m "Auto-build $(date '+%Y-%m-%d %H:%M')" && git push)

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
